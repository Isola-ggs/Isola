<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root {
    color-scheme: dark light;
    --bg:        #0E0E0E;
    --card:      #1A1A1A;
    --card-2:    #151515;
    --border:    rgba(255,255,255,.08);
    --border-2:  rgba(255,255,255,.14);
    --text:      #FFFFFF;
    --text-2:    #A3A3A3;
    --text-3:    #6E6E6E;
    --amber-bg:  #3A2708;  --amber:  #F5A524;
    --green-bg:  #0E2B1D;  --green:  #4ADE80;
    --red-bg:    #2E1414;  --red:    #F87171;
    --radius:    14px;
    --radius-sm: 10px;
  }
  /* Light palette. Applied when the system asks for it and nothing has
     been chosen, or when it has been chosen explicitly. Kept in one place
     so the two paths can never drift apart. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      color-scheme: light;
      --bg:#F2F2F0; --card:#FFFFFF; --card-2:#FAFAF9;
      --border:rgba(0,0,0,.08); --border-2:rgba(0,0,0,.14);
      --text:#0C0C0C; --text-2:#5F5F5C; --text-3:#84847F;
      --amber-bg:#FDF0D5; --amber:#8A5A06;
      --green-bg:#DDF3E5; --green:#12692F;
      --red-bg:#FBE6E4;   --red:#B03225;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#F2F2F0; --card:#FFFFFF; --card-2:#FAFAF9;
    --border:rgba(0,0,0,.08); --border-2:rgba(0,0,0,.14);
    --text:#0C0C0C; --text-2:#5F5F5C; --text-3:#84847F;
    --amber-bg:#FDF0D5; --amber:#8A5A06;
    --green-bg:#DDF3E5; --green:#12692F;
    --red-bg:#FBE6E4;   --red:#B03225;
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  .theme-toggle { display: inline-flex; gap: 2px; padding: 2px;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px; }
  .theme-toggle button {
    padding: .2rem .55rem; font-size: .72rem; line-height: 1.4;
    border: none; border-radius: 999px; background: transparent; color: var(--text-3);
  }
  .theme-toggle button:hover { background: var(--card-2); color: var(--text-2); }
  .theme-toggle button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 48rem; margin: 0 auto; padding: 1.75rem 1.1rem 5rem; }

  .demo-bar {
    background: var(--card); color: var(--text-2); border-bottom: 1px solid var(--border);
    font-size: .78rem; padding: .55rem 1.1rem; text-align: center;
  }
  .demo-bar b { font-weight: 500; color: var(--text); }

  .masthead {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap; margin-bottom: 1.75rem;
  }
  .wordmark { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .masthead-meta { font-size: .8rem; color: var(--text-3); }
  .masthead-meta a { color: var(--text-2); text-decoration: none; }
  .masthead-meta a:hover { color: var(--text); }

  h2 { font-size: 1.65rem; font-weight: 600; margin: 0; letter-spacing: -.02em; }
  h3 { font-size: 1rem; font-weight: 600; margin: 0 0 1rem; letter-spacing: -.01em; }
  p { margin: 0 0 .9rem; }
  .lede { color: var(--text-2); max-width: 38rem; }
  .hint { font-size: .82rem; color: var(--text-3); }
  .num { font-variant-numeric: tabular-nums; }
  .neg { color: var(--red); } .pos { color: var(--green); }

  /* Cards ---------------------------------------------------------- */

  .sheet {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.35rem 1.4rem;
  }
  .stack > * + * { margin-top: 1.1rem; }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .8rem; }
  .metric {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.15rem 1.25rem;
  }
  .metric .label { font-size: .88rem; color: var(--text-2); margin-bottom: .35rem; }
  .metric .value { font-size: 1.85rem; font-weight: 600; letter-spacing: -.03em;
                   font-variant-numeric: tabular-nums; line-height: 1.15; }
  .metric .value.muted { color: var(--text-3); }

  /* Tables --------------------------------------------------------- */

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: .82rem; font-weight: 400; color: var(--text-3);
    padding-bottom: .7rem; border-bottom: 1px solid var(--border);
  }
  td { padding: .8rem 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .r { text-align: right; }
  .role { display: block; font-size: .82rem; color: var(--text-3); margin-top: .1rem; }
  .kv td { padding: .55rem 0; }

  .total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px solid var(--border-2); margin-top: .3rem; padding-top: .85rem;
  }
  .total-row .k { font-weight: 500; }
  .total-row .v { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 1.05rem; }

  /* Pills ---------------------------------------------------------- */

  .stamp {
    display: inline-block; font-size: .78rem; font-weight: 500;
    padding: .3rem .8rem; border-radius: 999px; white-space: nowrap;
  }
  .stamp--draft       { background: var(--card-2); color: var(--text-3); border: 1px solid var(--border); }
  .stamp--locked      { background: var(--green-bg); color: var(--green); }
  .stamp--provisional { background: var(--amber-bg); color: var(--amber); }
  .stamp--final       { background: var(--green-bg); color: var(--green); }

  /* Controls ------------------------------------------------------- */

  button {
    font-family: inherit; font-size: .88rem; font-weight: 500;
    padding: .55rem 1.05rem; border-radius: var(--radius-sm);
    border: 1px solid var(--border-2); background: transparent; color: var(--text);
    cursor: pointer; transition: background .12s, border-color .12s;
  }
  button:hover { background: var(--card-2); border-color: var(--text-3); }
  button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  button.primary:hover { opacity: .88; }
  button.quiet { color: var(--text-2); }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--text-2); outline-offset: 2px;
  }

  input {
    font-family: inherit; font-size: .9rem; padding: .58rem .75rem; width: 100%;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--card-2); color: var(--text);
  }
  input::placeholder { color: var(--text-3); }
  input.num-input { text-align: right; font-variant-numeric: tabular-nums; }
  label { display: block; font-size: .82rem; color: var(--text-2); margin-bottom: .35rem; }
  .row { display: flex; gap: .7rem; flex-wrap: wrap; align-items: flex-end; }
  .row > * { flex: 1; min-width: 8rem; }
  .actions { display: flex; gap: .55rem; flex-wrap: wrap; margin-top: 1.1rem; }

  .error, .notice {
    border-radius: var(--radius-sm); padding: .7rem .95rem;
    font-size: .87rem; margin-bottom: 1rem;
  }
  .error  { background: var(--red-bg);   color: var(--red); }
  .notice { background: var(--amber-bg); color: var(--amber); }

  /* Period index --------------------------------------------------- */

  .period-row {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    width: 100%; text-align: left; padding: .95rem 0; font-size: 1rem;
    background: none; border: none; border-bottom: 1px solid var(--border);
    border-radius: 0; color: var(--text);
  }
  .period-row:last-of-type { border-bottom: none; }
  .period-row:hover { background: var(--card-2); border-color: var(--border); }
  .period-label { font-size: 1.05rem; font-weight: 500; }

  .signatures { display: flex; flex-wrap: wrap; gap: .45rem .9rem; margin-top: .9rem; }
  .signature {
    font-size: .8rem; color: var(--green); background: var(--green-bg);
    padding: .25rem .7rem; border-radius: 999px;
  }

  .trail { list-style: none; padding: 0; margin: 0; }
  .trail li {
    display: flex; gap: .9rem; padding: .55rem 0; font-size: .86rem;
    border-bottom: 1px solid var(--border); color: var(--text-2);
  }
  .trail li:last-child { border-bottom: none; }
  .trail time { font-size: .8rem; color: var(--text-3); white-space: nowrap; min-width: 5.5rem; }

  .whoami {
    display: flex; gap: .4rem; flex-wrap: wrap; align-items: center;
    margin-bottom: 1.25rem; font-size: .82rem; color: var(--text-3);
  }
  .whoami button { padding: .3rem .7rem; font-size: .8rem; color: var(--text-2); }
  .whoami button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 34rem) {
    .wrap { padding: 1.25rem .9rem 3.5rem; }
    .metric .value { font-size: 1.55rem; }
    h2 { font-size: 1.4rem; }
  }

  .tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.5rem;
          border-bottom: 1px solid var(--border); padding-bottom: .8rem; }
  .tab { padding: .4rem .85rem; font-size: .85rem; border-radius: 999px;
         border: 1px solid transparent; background: transparent; color: var(--text-2); }
  .tab:hover { background: var(--card); border-color: var(--border); }
  .tab[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  code { font-family: ui-monospace, monospace; font-size: .85em;
         background: var(--card-2); padding: .1rem .35rem; border-radius: 5px; }
  textarea:focus-visible { outline: 2px solid var(--text-2); outline-offset: 2px; }
</style>
<script>
(function(){
  try{
    var saved=localStorage.getItem('isola-theme');
    if(saved==='light'||saved==='dark')document.documentElement.setAttribute('data-theme',saved);
  }catch(e){}
})();
</script>

var LANG = (function(){
  try{ var v=localStorage.getItem('isola-lang'); if(v&&STRINGS[v])return v; }catch(e){}
  var nav=(navigator.language||'en');
  if(/^pt/i.test(nav))return 'ptBR';
  var base=nav.slice(0,2);
  return STRINGS[base]?base:'en';
})();

/* Missing key falls back to English, never to a raw key. A money screen
   showing "account.balance" is worse than one showing an English word. */
function t(key,params){
  var out=(STRINGS[LANG]&&STRINGS[LANG][key]) || STRINGS.en[key] || key;
  if(params)for(var k in params)out=out.split('{'+k+'}').join(params[k]);
  return out;
}
/* Country names come from Intl rather than the string table: the browser
   already knows "United Kingdom" in every language, and duplicating that
   into six hand-written lists would only create drift. */
function countryName(code){
  try{ return new Intl.DisplayNames([intlTag()],{type:'region'}).of(code)||code; }
  catch(e){ return code; }
}
function intlTag(){ return (LOCALES[LANG]||LOCALES.en).intl; }
function setLang(code){
  if(!STRINGS[code])return;
  LANG=code;
  try{ localStorage.setItem('isola-lang',code); }catch(e){}
  document.documentElement.setAttribute('lang', intlTag());
  render();
}

<script>
/* ============================================================ *
 * Engine — mirrors src/ledger.js
 * ============================================================ */
const BPS=10000;
function validateAllocations(a){
  const t=a.reduce((s,x)=>s+x.bps,0);
  if(t!==BPS)throw new Error(`Split totals ${(t/100).toFixed(2)}%, needs to total 100%`);
  return true;
}
function distribute(amount,allocs){
  const rows=allocs.map(a=>{const e=amount*a.bps;
    return{memberId:a.memberId,bps:a.bps,base:Math.floor(e/BPS),rem:e%BPS};});
  let left=amount-rows.reduce((s,r)=>s+r.base,0);
  [...rows].sort((x,y)=>y.rem-x.rem||(x.memberId<y.memberId?-1:1))
    .forEach(r=>{if(left>0){r.base+=1;left-=1;}});
  return rows.map(r=>({memberId:r.memberId,bps:r.bps,grossCents:r.base}));
}
const isActiveIn=(a,l)=>!(a.fromLabel&&l<a.fromLabel)&&!(a.toLabel&&l>a.toLabel);

function resolveAllocations(allocations,periodLabel){
  validateAllocations(allocations);
  const active=allocations.filter(a=>isActiveIn(a,periodLabel));
  if(!active.length)throw new Error(`No contributor holds a share in ${periodLabel}.`);
  const total=active.reduce((s,a)=>s+a.bps,0);
  if(total===BPS)return active.map(a=>({memberId:a.memberId,bps:a.bps}));
  const freed=BPS-total;
  const rows=active.map(a=>{const e=freed*a.bps;
    return{memberId:a.memberId,base:a.bps+Math.floor(e/total),rem:e%total};});
  let left=BPS-rows.reduce((s,r)=>s+r.base,0);
  [...rows].sort((x,y)=>y.rem-x.rem||(x.memberId<y.memberId?-1:1))
    .forEach(r=>{if(left>0){r.base+=1;left-=1;}});
  return rows.map(r=>({memberId:r.memberId,bps:r.base}));
}

/** Payout streams per platform. Only engagement moves between estimate and final. */
// Streams belong to a platform. Only the engagement-style ones settle in
// two stages, which is what makes a change to any other stream worth
// warning about rather than expected.
const PLATFORMS={
  fortnite:{label:'Fortnite',place:'Island',places:'Islands'},
  roblox:{label:'Roblox',place:'Experience',places:'Experiences'},
};
const STREAMS={
  engagement:{label:'Engagement payout',revisable:true,platform:'fortnite'},
  in_island:{label:'In-island transactions',revisable:false,platform:'fortnite'},
  sac:{label:'Support-a-Creator',revisable:false,platform:'fortnite'},
  sponsored:{label:'Sponsored row',revisable:false,platform:'fortnite'},
  engagement_payout:{label:'Engagement payout',revisable:true,platform:'roblox'},
  game_passes:{label:'Game passes',revisable:false,platform:'roblox'},
  developer_products:{label:'Developer products',revisable:false,platform:'roblox'},
};
const streamsFor=(platform)=>Object.keys(STREAMS).filter(k=>STREAMS[k].platform===platform);
const platformOf=(id)=>{

function classifyRevision(before,after){
  const sum=(ls,k)=>ls.filter(l=>l.stream===k).reduce((t,l)=>t+l.amountCents,0);
  const unexpected=[];
  STREAM_KEYS.filter(k=>!STREAMS[k].revisable).forEach(k=>{
    const b=sum(before,k),a=sum(after,k);
    if(b!==a)unexpected.push({stream:k,label:STREAMS[k].label,deltaCents:a-b});});
  return{engagementDeltaCents:sum(after,'engagement')-sum(before,'engagement'),
         unexpected,clean:unexpected.length===0};
}

const PLANS=[
  {key:'free',label:'Free',priceCents:0,maxMonthlyCents:200000,blurb:'For teams still finding an audience.'},
  {key:'starter',label:'Starter',priceCents:3900,maxMonthlyCents:2500000,blurb:'For a team splitting real money every month.'},
  {key:'studio',label:'Studio',priceCents:8900,maxMonthlyCents:10000000,blurb:'Several islands, several collaborators, bank reconciliation.'},
  {key:'pro',label:'Pro',priceCents:19900,maxMonthlyCents:Infinity,blurb:'For studios at the top of the Discover charts.'},
];
const PLAN_BY_KEY=Object.fromEntries(PLANS.map(p=>[p.key,p]));

/** Averaged over trailing months, so one good season does not move a team up a tier. */
function bandFor(byMonth){
  const m=Object.values(byMonth||{});
  const avg=m.length?Math.round(m.reduce((t,c)=>t+c,0)/m.length):0;
  const plan=PLANS.find(p=>avg<=p.maxMonthlyCents)||PLANS[PLANS.length-1];
  return{averageMonthlyCents:avg,monthsCounted:m.length,requiredPlan:plan.key};
}

/** Reading your own records is never gated. Billing pressure applies to posting only. */
function entitlements(sub,band){
  const cur=PLAN_BY_KEY[sub?.plan]||PLAN_BY_KEY.free;
  const req=PLAN_BY_KEY[band.requiredPlan];
  const over=req.priceCents>cur.priceCents;
  const grace=sub?.graceEndsAt?new Date(sub.graceEndsAt):null;
  const inGrace=Boolean(over&&grace&&new Date()<grace);
  const blocked=over&&!inGrace;
  return{currentPlan:cur.key,requiredPlan:req.key,over,inGrace,
    graceDaysLeft:inGrace?Math.ceil((grace-new Date())/864e5):0,
    canReadOwnAccount:true,canExportOwnStatement:true,
    canPostFigures:!blocked,
    reason:blocked?`Your trailing average needs the ${req.label} plan. Existing records stay readable and exportable; posting new figures is paused until you upgrade.`
      :inGrace?`You have moved into the ${req.label} band. Upgrade before posting pauses.`:null};
}

const PAYOUT_THRESHOLD=10000;
const thresholdStatus=c=>({thresholdCents:PAYOUT_THRESHOLD,accumulatedCents:c,

/**
 * One statement per island, merged into per-contributor lines. Advances
 * and carried adjustments belong to the person, so they apply once against
 * the merged total rather than once per island.
 */
function buildPeriodStatement({periodId,stage,islands,advances=[],
                               recoupMode='from_member',adjustments=[]}){
  if(!islands||!islands.length)throw new Error('A period needs at least one island');
  const perIsland=[],merged=new Map();

  for(const isle of islands){
    const allocs=resolveAllocations(isle.allocations,periodId);
    const exp=isle.expenseCents||0;
    if(exp>isle.grossCents)
      throw new Error(`${isle.islandName}: expenses exceed the payout for this period.`);
    const dist=isle.grossCents-exp;
    const lines=distribute(dist,allocs);
    perIsland.push({islandId:isle.islandId,islandName:isle.islandName,code:isle.code,
      grossCents:isle.grossCents,expenseCents:exp,distributableCents:dist,lines});
    lines.forEach(l=>{
      const e=merged.get(l.memberId)||{memberId:l.memberId,grossCents:0,islands:[]};
      e.grossCents+=l.grossCents;
      e.islands.push({islandName:isle.islandName,bps:l.bps,grossCents:l.grossCents});
      merged.set(l.memberId,e);});
  }

  const shares=[...merged.values()].map(m=>({...m,recoupedCents:0}));
  const byMember=new Map(shares.map(s=>[s.memberId,s]));
  const applied=[];
  for(const adv of advances.filter(a=>a.outstandingCents>0)){
    const s=byMember.get(adv.memberId); if(!s)continue;
    const take=Math.min(adv.outstandingCents,Math.max(0,s.grossCents-s.recoupedCents));
    if(take>0){s.recoupedCents+=take;
      applied.push({advanceId:adv.id,memberId:adv.memberId,appliedCents:take});}}

  const adjMap=new Map();
  adjustments.forEach(a=>adjMap.set(a.memberId,(adjMap.get(a.memberId)||0)+a.amountCents));

  const lines=shares.map(s=>{const adj=adjMap.get(s.memberId)||0;
    return{memberId:s.memberId,grossCents:s.grossCents,recoupedCents:s.recoupedCents,
           adjustmentCents:adj,netCents:s.grossCents-s.recoupedCents+adj,islands:s.islands};})
    .sort((a,b)=>b.grossCents-a.grossCents);

  return{periodId,stage,islands:perIsland,
    grossCents:perIsland.reduce((t,i)=>t+i.grossCents,0),
    expenseCents:perIsland.reduce((t,i)=>t+i.expenseCents,0),
    distributableCents:perIsland.reduce((t,i)=>t+i.distributableCents,0),
    recoupApplied:stage==='final'?applied:[],recoupProjected:stage==='provisional'?applied:[],
    lines,totalNetCents:lines.reduce((t,l)=>t+l.netCents,0)};
}

function reconcile(prov,fin,carryTo){
  const before=new Map(prov.lines.map(l=>[l.memberId,l.netCents]));
  return{grossDeltaCents:fin.grossCents-prov.grossCents,
    adjustments:fin.lines.map(l=>({memberId:l.memberId,
      amountCents:l.netCents-(before.get(l.memberId)??0),carryToPeriodId:carryTo}))
      .filter(a=>a.amountCents!==0)};
}
function matchBank(rows,payments){
  const taken=new Set();let matched=0;
  rows.filter(r=>!r.matchedId).forEach(row=>{
    const out=Math.abs(row.amountCents);
    let hit=row.reference?payments.find(p=>!taken.has(p.id)&&p.reference&&p.reference===row.reference):null;
    if(!hit){const same=payments.filter(p=>!taken.has(p.id)&&Math.abs(p.amountCents)===out);
      if(same.length===1)hit=same[0];}
    if(hit){taken.add(hit.id);row.matchedId=hit.id;matched++;}});
  return{matched,examined:rows.length};
}
function normaliseIslandCode(input){
  const d=String(input||'').replace(/\D/g,'');
  if(d.length!==12)throw new Error('An island code is twelve digits, written 1234-5678-9012.');
  return `${d.slice(0,4)}-${d.slice(4,8)}-${d.slice(8)}`;
}

      <div id="pay-form"></div></div>`:''}

  const csv=document.getElementById('csv');
  if(csv)csv.onclick=()=>{
    const d=c=>(c/100).toFixed(2);let r=0;
    const out=[['Statement of account'],['Team',S.team.name],['Contributor',M[S.you]],['Currency','USD'],[],
      ['Date','Type','Period','Description','Reference','Credit','Debit','Balance'],
      ['','Opening balance','','','','','',d(0)]];
    mine.forEach(e=>{r+=e.amountCents;
      out.push([e.effectiveAt,entryLabel(e.entryType),e.periodLabel,e.description,e.reference,
        e.amountCents>0?d(e.amountCents):'',e.amountCents<0?d(Math.abs(e.amountCents)):'',d(r)]);});
    out.push([],['','Closing balance owed','','','','','',d(balanceOf(S.you))]);
    downloadCsv(out,`isola-${S.you}-statement.csv`);};

  document.querySelectorAll('[data-pay]').forEach(el=>el.onclick=()=>payForm(el.dataset.pay));
}

function payForm(who){
  const owed=balanceOf(who);
  document.getElementById('pay-form').innerHTML=`
    <div style="margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--border-2)">
      <h3>Payment to ${esc(M[who])}</h3>
      <div class="row">
        <div><label for="pf-amt">Amount</label>
          <input id="pf-amt" class="num-input" inputmode="decimal" value="${(owed/100).toFixed(2)}" /></div>
        <div><label for="pf-ref">Reference</label><input id="pf-ref" placeholder="FPS-90414" /></div></div>
      <p class="hint" style="margin:.7rem 0 0">Owed right now: ${money(owed)}. Partial payments are fine.</p>
      <div class="actions"><button class="primary" id="pf-save">${esc(t('account.recordPayment'))}</button>
        <button class="quiet" id="pf-cancel">${esc(t('common.cancel'))}</button></div></div>`;
  document.getElementById('pf-cancel').onclick=()=>{document.getElementById('pay-form').innerHTML='';};
  document.getElementById('pf-save').onclick=()=>{
    const cents=toCents(document.getElementById('pf-amt').value);
    if(!cents){S.error='Enter an amount.';return render();}
    if(cents>owed){S.error=`That is more than ${M[who]} is owed (${money(owed)}).`;return render();}
    S.entries.push({id:eid(),userId:who,entryType:'payment',amountCents:-cents,
      description:'Payment sent',periodLabel:'',reference:document.getElementById('pf-ref').value||'',
      effectiveAt:new Date().toISOString().slice(0,10)});
    S.error=null;S.notice=`Recorded ${money(cents)} to ${M[who]}.`;render();};
}

function collectRevenue(prefix){
  const out=[];
  document.querySelectorAll(`[id^="${prefix}-"]`).forEach(el=>{
    const c=toCents(el.value);
    if(c)out.push({islandId:el.dataset.island,stream:el.dataset.stream,amountCents:c});});
  return out;
}

    <table><thead><tr><th>${esc(t('common.contributorCol'))}</th><th>Islands</th><th class="r">${esc(t('common.gross'))}</th>
    ${anyRecoup?'<th class="r">Recoup</th>':''}${anyAdj?'<th class="r">Carried</th>':''}
    <th class="r">${esc(t('common.net'))}</th>${before?'<th class="r">Change</th>':''}</tr></thead><tbody>
    ${st.lines.map(l=>{const d=before?l.netCents-(before.get(l.memberId)??0):null;
      return `<tr><td>${esc(M[l.memberId])}<span class="role">${esc(ROLES[l.memberId])}</span></td>
      <td class="hint">${l.islands.map(i=>`${esc(i.islandName)} ${pct(i.bps)}`).join('<br>')}</td>
      <td class="r num">${money(l.grossCents)}</td>
      ${anyRecoup?`<td class="r num neg">${l.recoupedCents?money(-l.recoupedCents):''}</td>`:''}

function viewPeriod(){
  const p=S.periods[S.view.index];
  const pending=pendingFor(p.label);
  const inputs=(rev)=>liveIslands().map(i=>({
    islandId:i.id,islandName:i.name,code:i.code,
    grossCents:rev.filter(r=>r.islandId===i.id).reduce((t,r)=>t+r.amountCents,0),
    expenseCents:expenseFor(i.id,p.label),allocations:i.allocations}));
  let body='';

  if(p.state==='draft'){
    const exp=liveIslands().reduce((t,i)=>t+expenseFor(i.id,p.label),0);
    body=`<p class="lede">${esc(t('periods.lockNote'))}</p>
      ${exp?`<div class="notice">${money(exp)} of expenses will be deducted before splitting.</div>`:''}
      ${pending.length?`<div class="notice">${pending.length} adjustment${pending.length>1?'s':''} carried in from September will apply here.</div>`:''}
      ${isOwner()?`<div class="actions"><button class="primary" id="lock">${esc(t('periods.lock'))}</button></div>`
                 :`<p class="hint">${esc(t('periods.ownerLocks'))}</p>`}`;
  }
  if(p.state==='locked'){
    body=`<p class="lede">${esc(t('periods.lockedNote'))}</p>
      ${isOwner()?`<div class="sheet"><h3>${esc(t('periods.postProvisional'))}</h3>${revenueInputs('pv')}
        <div class="actions"><button class="primary" id="prov">${esc(t('periods.postProvisional'))}</button>
        <button class="quiet" id="fp">${esc(t('periods.useExample'))}</button></div></div>`:''}`;
  }
  if(p.state==='provisional'||p.state==='final'){
    const pr=p.statements.provisional,fi=p.statements.final,cur=fi||pr;
    const delta=fi?fi.grossCents-pr.grossCents:null;
    const rev=fi?classifyRevision(p.revenue.provisional,p.revenue.final):null;
    body=metrics([
      {label:t('periods.grossPayout'),value:money(cur.grossCents)},
      {label:t('periods.distributable'),value:money(cur.distributableCents)},
      delta===null?{label:t('periods.revision'),value:'\u2014',muted:true}
        :{label:t('periods.revision'),value:delta===0?'\u2014':money(delta),tone:delta<0?'red':'green'},
    ])+`<div style="margin-top:1.1rem"></div>
      ${rev&&!rev.clean?`<div class="error">Only the engagement payout should move between estimate and
        final. ${rev.unexpected.map(u=>`${esc(u.label)} changed by ${money(u.deltaCents)}`).join('; ')}.
        That is almost certainly a keying error \u2014 check the figures before settling.</div>`:''}
      <div class="sheet" style="margin-bottom:1.1rem"><h3>${esc(t('periods.revenueStreams'))}</h3>
        <table class="kv"><tbody>${(p.revenue[fi?'final':'provisional']||[]).map(r=>
          `<tr><td>${esc(STREAMS[r.stream].label)}<span class="role">${esc((S.islands.find(i=>i.id===r.islandId)||{}).name||'')}</span></td>
           <td class="r num">${money(r.amountCents)}</td></tr>`).join('')}</tbody></table></div>
      <p class="lede">${fi?`Final. the platform revised the total ${delta<0?'down':'up'} by ${money(Math.abs(delta))}.
        Provisional credits were reversed and the settled figures booked.`
        :t('periods.provisionalNote')}</p>
      ${statementTable(cur,fi?pr:null)}
      ${!fi&&isOwner()?`<div class="sheet" style="margin-top:1.1rem"><h3>${esc(t('periods.postFinal'))}</h3>${revenueInputs('fn')}
        <div class="actions"><button class="primary" id="final">${esc(t('periods.postFinal'))}</button>
        <button class="quiet" id="ff">${esc(t('periods.useExample'))}</button></div></div>`:''}`;
  }

  app.innerHTML=`${whoami()}${banners()}<div class="stack">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.4rem">
      <div><button class="quiet" id="back" style="margin-bottom:.5rem">&larr; ${esc(t('periods.allPeriods'))}</button>
        <h2>${esc(p.label)}</h2></div>
      <span class="stamp stamp--${esc(p.state)}">${esc(p.state)}</span></div>
    <div>${body}</div></div>`;

  document.getElementById('back').onclick=()=>{S.view={};S.error=S.notice=null;render();};

  const lock=document.getElementById('lock');
  if(lock)lock.onclick=()=>{
    try{liveIslands().forEach(i=>resolveAllocations(i.allocations,p.label));}
    catch(e){S.error=e.message;return render();}
    p.state='locked';S.notice=null;render();};

  const ex={pv:{engagement:[1000000,380000],in_island:[420000,88000],sac:[52000,0],sponsored:[18000,0]},
            fn:{engagement:[962000,371000],in_island:[420000,88000],sac:[52000,0],sponsored:[18000,0]}};
  ['fp','ff'].forEach((id,n)=>{const b=document.getElementById(id);
    if(b)b.onclick=()=>{const pre=n?'fn':'pv';
      liveIslands().forEach((isle,ix)=>streamsFor(isle.platform||'fortnite').forEach(k=>{
        const el=document.getElementById(`${pre}-${isle.id}-${k}`);
        if(el&&ex[pre][k][ix])el.value=(ex[pre][k][ix]/100).toFixed(2);}));};});

  const prov=document.getElementById('prov');
  if(prov)prov.onclick=()=>{
    const lines=collectRevenue('pv');
    if(!lines.length){S.error='Enter at least one figure.';return render();}
    const adjs=pendingFor(p.label);
    let st;try{st=buildPeriodStatement({periodId:p.label,stage:'provisional',islands:inputs(lines),
      advances:S.advances,adjustments:adjs});}catch(e){S.error=e.message;return render();}
    adjs.forEach(a=>{a.consumed=true;});
    st.lines.forEach(l=>S.entries.push({id:eid(),userId:l.memberId,entryType:'credit_provisional',
      amountCents:l.netCents,description:`Provisional share of ${p.label}`,periodLabel:p.label,
      reference:'',effectiveAt:new Date().toISOString().slice(0,10)}));
    p.statements.provisional=st;p.revenue.provisional=lines;p.state='provisional';
    S.error=null;render();};

  const fin=document.getElementById('final');
  if(fin)fin.onclick=()=>{
    const lines=collectRevenue('fn');
    if(!lines.length){S.error='Enter at least one figure.';return render();}
    let st;try{st=buildPeriodStatement({periodId:p.label,stage:'final',islands:inputs(lines),
      advances:S.advances,
      adjustments:p.statements.provisional.lines.filter(l=>l.adjustmentCents)
        .map(l=>({memberId:l.memberId,amountCents:l.adjustmentCents}))});}
    catch(e){S.error=e.message;return render();}

    S.entries.filter(e=>e.periodLabel===p.label&&e.entryType==='credit_provisional')
      .forEach(e=>S.entries.push({id:eid(),userId:e.userId,entryType:'credit_reversal',
        amountCents:-e.amountCents,description:`Reversal of provisional estimate for ${p.label}`,
        periodLabel:p.label,reference:'',effectiveAt:new Date().toISOString().slice(0,10)}));
    st.lines.forEach(l=>S.entries.push({id:eid(),userId:l.memberId,entryType:'credit_final',
      amountCents:l.netCents,description:`Final share of ${p.label}`,periodLabel:p.label,
      reference:'',effectiveAt:new Date().toISOString().slice(0,10)}));
    st.recoupApplied.forEach(a=>{const adv=S.advances.find(x=>x.id===a.advanceId);
      if(adv)adv.outstandingCents=Math.max(0,adv.outstandingCents-a.appliedCents);});

    const[y,m]=p.label.split('-').map(Number);
    const next=`${m===12?y+1:y}-${String(m===12?1:m+1).padStart(2,'0')}`;
    reconcile(p.statements.provisional,st,next).adjustments
      .forEach(a=>S.adjustments.push({...a,carryTo:next,consumed:false}));
    if(!S.periods.some(x=>x.label===next))
      S.periods.push({label:next,state:'draft',statements:{},revenue:{}});

    p.statements.final=st;p.revenue.final=lines;p.state='final';
    S.error=null;S.notice=`Credits booked. Adjustments carried into ${next}.`;render();};
}

    <p class="hint" style="margin:0">${esc(t('pnl.ownerOnly'))}</p></div>`;return;}

  finals.forEach(p=>(p.revenue.final||[]).forEach(r=>{
    byStream[r.stream]=(byStream[r.stream]||0)+r.amountCents;
    const n=(S.islands.find(i=>i.id===r.islandId)||{}).name||'?';
    byIsland[n]=(byIsland[n]||0)+r.amountCents;}));
  S.expenses.forEach(x=>{byCat[x.category]=(byCat[x.category]||0)+x.amountCents;});
  const revenue=Object.values(byStream).reduce((a,b)=>a+b,0);
  const expense=Object.values(byCat).reduce((a,b)=>a+b,0);

  app.innerHTML=`${whoami()}${banners()}<div class="stack">
    <div style="margin-bottom:.4rem"><h2>${esc(t('pnl.title'))}</h2>
      <p class="hint" style="margin:.2rem 0 0">${esc(t('pnl.subtitle'))}</p></div>
    ${metrics([
      {label:t('pnl.revenue'),value:money(revenue)},
      {label:t('common.expenses'),value:money(expense),tone:expense?'red':null},
      {label:t('pnl.net'),value:money(revenue-expense),tone:revenue-expense>=0?'green':'red'},
    ])}
    <div class="sheet"><h3>${esc(t('pnl.byIsland'))}</h3>
      <table><tbody>${Object.entries(byIsland).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
        `<tr><td>${esc(k)}</td><td class="r num">${money(v)}</td>
         <td class="r hint" style="width:4rem">${((v/revenue)*100).toFixed(0)}%</td></tr>`).join('')}
      </tbody></table></div>
    <div class="sheet"><h3>${esc(t('pnl.byStream'))}</h3>
      <table><tbody>${Object.entries(byStream).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
        `<tr><td>${esc(STREAMS[k].label)}</td><td class="r num">${money(v)}</td></tr>`).join('')}
      </tbody></table>${totalRow(t('pnl.revenue'),revenue)}</div>
    <div class="sheet"><h3>${esc(t('pnl.byCategory'))}</h3>
      ${!expense?`<p class="hint" style="margin:0">${esc(t('expenses.none'))}</p>`:
      `<table><tbody>${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
        `<tr><td>${esc(k)}</td><td class="r num neg">${money(v)}</td></tr>`).join('')}
      </tbody></table>${totalRow(t('common.expenses'),expense)}`}</div>
  </div>`;
}

function viewPeople(){
  const openShare=k=>S.islands.some(i=>i.allocations.some(a=>a.memberId===k&&!a.toLabel));
  app.innerHTML=`${whoami()}${banners()}<div class="stack">
    <div style="margin-bottom:.4rem"><h2>${esc(t('people.title'))}</h2></div>
    <div class="sheet"><h3>${esc(t('people.team'))}</h3>
      <table><thead><tr><th>${esc(t('common.contributorCol'))}</th><th>${esc(t('people.role'))}</th><th class="r">${esc(t('common.balance'))}</th>${isOwner()?'<th></th>':''}</tr></thead>
      <tbody>${Object.keys(M).map(k=>`<tr${S.active[k]?'':' style="opacity:.5"'}>
        <td>${esc(M[k])}<span class="role">${esc(ROLES[k])}${S.active[k]?'':' · offboarded'}</span></td>
        <td>${esc(S.roles[k])}</td><td class="r num">${money(balanceOf(k))}</td>
        ${isOwner()?`<td class="r">${S.active[k]?`
          <button class="quiet" data-role="${k}">${S.roles[k]==='owner'?'Demote':'Make owner'}</button>
          <button class="quiet" data-off="${k}">${esc(t('people.offboard'))}</button>`:''}</td>`:''}</tr>`).join('')}
      </tbody></table>
      <p class="hint" style="margin:.9rem 0 0">${esc(t('people.offboardRules'))}</p></div>
    ${isOwner()?`<div class="sheet"><h3>${esc(t('people.invite'))}</h3>
      <p class="hint" style="margin:0 0 .9rem">${esc(t('people.inviteNote'))}</p>
      <div class="row"><div style="flex:2"><label for="i-email">${esc(t('people.email'))}</label>
        <input id="i-email" placeholder="new@example.com" /></div></div>
      <div class="actions"><button class="primary" id="do-invite">${esc(t('people.createInvite'))}</button></div>
      <div id="invite-out"></div></div>`:''}
  </div>`;

  document.querySelectorAll('[data-role]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.role;
    if(S.roles[k]==='owner'){
      if(Object.keys(S.roles).filter(x=>S.roles[x]==='owner'&&S.active[x]).length<=1){
        S.error='That is the only owner. Promote someone else first.';return render();}
      S.roles[k]='contributor';S.notice=`${M[k]} is now a contributor.`;
    }else{S.roles[k]='owner';S.notice=`${M[k]} is now an owner.`;}
    S.error=null;render();});

  document.querySelectorAll('[data-off]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.off,bal=balanceOf(k);
    if(bal>0){S.error=`${M[k]} is still owed ${money(bal)}. Settle up before offboarding.`;return render();}
    if(bal<0){S.error=`${M[k]} has been overpaid by ${money(Math.abs(bal))}.`;return render();}
    if(openShare(k)){S.error='They still hold an open-ended share on at least one island. End it first.';return render();}
    S.active[k]=false;S.error=null;S.notice=`${M[k]} offboarded. Their record stays on the ledger.`;render();});

  const inv=document.getElementById('do-invite');
  if(inv)inv.onclick=()=>{
    const email=document.getElementById('i-email').value.trim();
    if(!/^[^@\s]+@[^@\s]+$/.test(email)){S.error='Enter a valid email address.';return render();}
    const token=Array.from({length:16},()=>Math.random().toString(36)[2]).join('');
    S.invites.push({email,token});S.error=null;render();
    document.getElementById('invite-out').innerHTML=
      `<div style="margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--border-2)">
        <p class="hint" style="margin:0 0 .5rem">${esc(t('people.inviteLink'))}</p>
        <div style="font-family:ui-monospace,monospace;font-size:.8rem;word-break:break-all;
          background:var(--card-2);padding:.7rem .8rem;border-radius:10px;color:var(--text-2)">
          https://your-host/invite/${esc(token)}</div></div>`;};
}


function volumeByMonth(){
  const out={};
  S.periods.filter(p=>p.state==='final').forEach(p=>{
    out[p.label]=(p.revenue.final||[]).reduce((t,r)=>t+r.amountCents,0);});
  return out;
}

function viewBilling(){
  const band=bandFor(volumeByMonth());
  const e=entitlements(S.subscription,band);
  const plan=PLAN_BY_KEY[e.currentPlan],needed=PLAN_BY_KEY[e.requiredPlan];

  if(!isOwner()){
    app.innerHTML=`${whoami()}<div class="stack">
      <div style="margin-bottom:.4rem"><h2>${esc(t('billing.title'))}</h2></div>
      <div class="sheet"><h3>${esc(t('billing.title'))}</h3>
        <p class="hint" style="margin:0">${e.canPostFigures
          ? t('billing.nothingToDo')
          : t('billing.contributorNote')}</p>
      </div></div>`;
    return;
  }

  app.innerHTML=`${whoami()}${banners()}<div class="stack">
    <div style="margin-bottom:.4rem"><h2>${esc(t('billing.title'))}</h2>
      <p class="hint" style="margin:.2rem 0 0">${esc(t('billing.subtitle'))}</p></div>

    ${metrics([
      {label:t('billing.trailingAverage'),value:money(band.averageMonthlyCents)},
      {label:t('billing.currentPlan'),value:plan.label},
      {label:t('billing.monthlyCost'),value:plan.priceCents?money(plan.priceCents):t('billing.free'),
       muted:!plan.priceCents},
    ])}

    ${!e.canPostFigures?`<div class="error">${esc(e.reason)}</div>`
      :e.inGrace?`<div class="notice">${esc(e.reason)}</div>`:''}

    <div class="sheet"><h3>${esc(t('billing.plans'))}</h3>
      <table><thead><tr><th>${esc(t('billing.currentPlan'))}</th><th class="r">${esc(t('billing.upTo'))}</th><th class="r">${esc(t('billing.price'))}</th><th></th></tr></thead>
      <tbody>${PLANS.map(p=>`<tr${p.key===e.currentPlan?' style="font-weight:500"':''}>
        <td>${esc(p.label)}<span class="role">${esc(p.blurb)}</span></td>
        <td class="r num">${p.maxMonthlyCents===Infinity?t('billing.noLimit'):money(p.maxMonthlyCents)+'/mo'}</td>
        <td class="r num">${p.priceCents?money(p.priceCents)+'/mo':t('billing.free')}</td>
        <td class="r">${p.key===e.currentPlan?`<span class="stamp stamp--final">${esc(t('billing.current'))}</span>`
          :`<button class="quiet" data-plan="${p.key}">${esc(t('billing.choose'))}</button>`}</td></tr>`).join('')}
      </tbody></table></div>

    <div class="sheet"><h3>${esc(t('billing.trailingAverage'))}</h3>
      ${Object.keys(volumeByMonth()).length
        ? `<table><tbody>${Object.entries(volumeByMonth()).map(([l,c])=>
            `<tr><td class="num">${esc(l)}</td><td class="r num">${money(c)}</td></tr>`).join('')}
           </tbody></table>`
        : `<p class="hint" style="margin:0">${esc(t('pnl.noFinal'))}</p>`}
      <p class="hint" style="margin:.9rem 0 0">${esc(t('billing.onlyFinal'))}</p></div>

    <div class="sheet"><h3>${esc(t('billing.neverGated'))}</h3>
      <table class="kv"><tbody>
        <tr><td>${esc(t('billing.readOwn'))}</td><td class="r pos">${esc(t('billing.alwaysFree'))}</td></tr>
        <tr><td>${esc(t('billing.exportOwn'))}</td><td class="r pos">${esc(t('billing.alwaysFree'))}</td></tr>
        <tr><td>${esc(t('billing.everyContributor'))}</td><td class="r pos">${esc(t('billing.alwaysFree'))}</td></tr>
        <tr><td>${esc(t('billing.postFigures'))}</td><td class="r hint">${esc(t('billing.needsBand'))}</td></tr>
      </tbody></table>
      <p class="hint" style="margin:.9rem 0 0">${esc(t('billing.neverGatedNote'))}</p></div>
  </div>`;

  document.querySelectorAll('[data-plan]').forEach(el=>el.onclick=()=>{
    const target=PLAN_BY_KEY[el.dataset.plan];
    if(target.priceCents<PLAN_BY_KEY[band.requiredPlan].priceCents){
      S.error=`Your trailing average is ${money(band.averageMonthlyCents)} a month, which needs `
        +`${PLAN_BY_KEY[band.requiredPlan].label}. Downgrading would pause posting straight away.`;
      return render();}
    S.subscription={plan:target.key,status:'active',graceEndsAt:null};
    S.error=null;S.notice=`Now on ${target.label}.`;render();});
}

  var sel=document.getElementById('lang-select');
  if(sel)sel.innerHTML=Object.keys(LOCALES).map(function(c){

  if(tt)tt.querySelectorAll('[data-theme-set]').forEach(function(b){
    b.textContent=t('theme.'+b.dataset.themeSet);});
  renderTabs();
  ({islands:viewIslands,account:viewAccount,periods:viewPeriods,bank:viewBank,
    pnl:viewPnl,people:viewPeople,billing:viewBilling,discord:viewDiscord}[S.tab]||viewIslands)();
  var langSel=document.getElementById('lang-select');
  if(langSel)langSel.onchange=function(){ setLang(this.value); };
  document.querySelectorAll('[data-who]').forEach(el=>el.onclick=()=>{
    S.you=el.dataset.who;S.error=S.notice=null;S.view={};render();});
}
render();

<script>
/**
 * Theme control. Three states rather than two: someone who has not chosen
 * should keep following their system, and a binary toggle quietly takes
 * that away the first time it is clicked.
 */
(function(){
  var root=document.documentElement;
  var group=document.getElementById('theme-toggle');
  if(!group)return;

  function current(){ return root.getAttribute('data-theme') || 'system'; }

  function paint(){
    var now=current();
    group.querySelectorAll('[data-theme-set]').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.themeSet===now));
    });
  }

  group.addEventListener('click', function(e){
    var button=e.target.closest('[data-theme-set]');
    if(!button)return;
    var choice=button.dataset.themeSet;
    if(choice==='system'){
      root.removeAttribute('data-theme');
      try{ localStorage.removeItem('isola-theme'); }catch(err){}
    }else{
      root.setAttribute('data-theme',choice);
      try{ localStorage.setItem('isola-theme',choice); }catch(err){}
    }
    paint();
  });

  paint();
})();
</script>
